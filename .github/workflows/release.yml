name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@59b7218bfc2eaabc464f1254f6e1dac5bda91d94 # v4.4.0

      - uses: chainguard-actions/pnpm-action-setup@dbd76d4f034a197a459098e87afc6916ec671849 # v6.1.1

      - uses: chainguard-actions/actions-setup-node@031fc9bd73e651da81e6a7294b2af29e64d5f39c # v4.4.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Publishes every public package in dependency order, with workspace:*
      # rewritten to exact versions, skipping private packages and versions
      # already on npm, so bump versions before cutting a release. pnpm
      # publishes natively with tokenless OIDC trusted publishing. The release
      # checkout is a detached tag, so pnpm's branch check is skipped.
      - name: Publish
        run: pnpm publish -r --no-git-checks --provenance --access public
