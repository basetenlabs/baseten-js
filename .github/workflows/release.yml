name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Publishes every public package in dependency order, with workspace:*
      # rewritten to exact versions, skipping private packages and versions
      # already on npm, so bump versions before cutting a release. pnpm hands
      # each packed tarball to the npm CLI, which does the tokenless OIDC
      # trusted publishing and which Node 26 bundles at a version with it. The
      # release checkout is a detached tag, so pnpm's branch check is skipped.
      - name: Publish
        run: pnpm publish -r --no-git-checks --provenance --access public
