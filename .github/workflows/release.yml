name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # npm trusted publishing (tokenless OIDC) is implemented in the npm CLI,
      # not pnpm, so publish with npm. Requires a recent npm.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # Fails if the version is already on npm, so bump the version before
      # cutting a release. The private e2e-tests package is not published here.
      - name: Publish
        working-directory: packages/client
        run: npm publish --provenance --access public
