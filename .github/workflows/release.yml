name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Publishes every public workspace package whose version is not yet on
      # npm; private packages (e2e tests) are skipped. Uses npm trusted
      # publishing (OIDC) so no token is needed.
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks --provenance
