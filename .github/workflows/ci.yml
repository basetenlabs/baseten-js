name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false

      - uses: chainguard-actions/actions-checkout@59b7218bfc2eaabc464f1254f6e1dac5bda91d94 # v4.4.0

      - uses: chainguard-actions/pnpm-action-setup@dbd76d4f034a197a459098e87afc6916ec671849 # v6.1.1

      - uses: chainguard-actions/actions-setup-node@031fc9bd73e651da81e6a7294b2af29e64d5f39c # v4.4.0
        with:
          node-version: "26"

      - run: pnpm install --frozen-lockfile

      - name: Generate API and check for diff
        run: |
          pnpm run generate-api
          git diff --exit-code

      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        env:
          # Forks won't have these secrets so e2e tests skip, but pushes
          # to main will run them.
          BASETEN_E2E_TEST_API_KEY: ${{ secrets.BASETEN_E2E_TEST_API_KEY }}
          BASETEN_E2E_TEST_DOMAIN: ${{ secrets.BASETEN_E2E_TEST_DOMAIN }}
          BASETEN_E2E_TEST_MODEL_ID: ${{ secrets.BASETEN_E2E_TEST_MODEL_ID }}
        run: pnpm test

      # Node 22 bundles undici 6, so the sandbox package must refuse an
      # installed undici 8. Last, since it switches Node.
      - uses: chainguard-actions/actions-setup-node@031fc9bd73e651da81e6a7294b2af29e64d5f39c # v4.4.0
        with:
          node-version: "22"

      - name: Test sandbox transport under Node 22
        working-directory: packages/sandbox
        run: pnpm exec vitest run tests/transport.test.ts

  test-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@59b7218bfc2eaabc464f1254f6e1dac5bda91d94 # v4.4.0

      - uses: chainguard-actions/oven-sh-setup-bun@5817dfcd47d1008cf4cce29ca319c0bdd77e2eed # v2.2.0

      - run: bun install

      - name: Test client under Bun
        working-directory: packages/client
        run: bun run test
