name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate API and check for diff
        run: |
          npm run generate-api
          git diff --exit-code

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
