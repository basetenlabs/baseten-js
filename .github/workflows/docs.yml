name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: chainguard-actions/actions-checkout@59b7218bfc2eaabc464f1254f6e1dac5bda91d94 # v4.4.0

      - uses: chainguard-actions/pnpm-action-setup@dbd76d4f034a197a459098e87afc6916ec671849 # v6.1.1

      - uses: chainguard-actions/actions-setup-node@031fc9bd73e651da81e6a7294b2af29e64d5f39c # v4.4.0
        with:
          node-version: "26"

      - run: pnpm install --frozen-lockfile

      # Sandbox docs resolve @basetenlabs/client through its built dist.
      - name: Build
        run: pnpm run build

      # Each package writes its docs to its own subdirectory of _site.
      - name: Generate docs
        run: pnpm -r run generate-docs

      - name: Root landing page
        run: |
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Baseten JS SDK docs</title>
          <h1>Baseten JS SDK docs</h1>
          <ul>
            <li><a href="client/">@basetenlabs/client</a></li>
            <li><a href="sandbox/">@basetenlabs/sandbox</a></li>
          </ul>
          <p><a href="https://github.com/basetenlabs/baseten-js">GitHub repository</a></p>
          EOF

      - uses: chainguard-actions/actions-upload-pages-artifact@910d554a410bf61031b9fc5b7f6930040f193dc7 # v3.0.1
        with:
          path: _site

      - id: deployment
        uses: chainguard-actions/actions-deploy-pages@f4d5c29b63bb3df1e6eac647993dd0c3fe33651c # v4.0.5
