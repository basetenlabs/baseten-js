name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: pnpm install --frozen-lockfile

      # Each package writes its docs to its own subdirectory of _site.
      - name: Generate docs
        run: pnpm -r run generate-docs

      - name: Root landing page
        run: |
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Baseten JS SDK docs</title>
          <h1>Baseten JS SDK docs</h1>
          <ul>
            <li><a href="client/">@basetenlabs/client</a></li>
            <li><a href="sandbox/">@basetenlabs/sandbox</a></li>
          </ul>
          <p><a href="https://github.com/basetenlabs/baseten-js">GitHub repository</a></p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
